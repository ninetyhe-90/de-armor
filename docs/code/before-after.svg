<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Illustration: bloated new helper versus reusing the existing formatDate">
  <defs>
    <style>
      text { white-space: pre; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .k { fill: #c084fc; }
      .s { fill: #fbbf24; }
      .s2 { fill: #86efac; }
      .c { fill: #64748b; }
      .g1 { animation: g1 3s steps(1) infinite; }
      .g2 { animation: g2 3s steps(1) infinite; }
      @keyframes g1 { 0%, 90%, 100% { transform: translate(0, 0); } 92% { transform: translate(4px, -1px); } 95% { transform: translate(-3px, 1px); } }
      @keyframes g2 { 0%, 90%, 100% { transform: translate(0, 0); } 92% { transform: translate(-4px, 1px); } 95% { transform: translate(3px, -1px); } }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
      @media (prefers-reduced-motion: reduce) { .g1, .g2, .blink, .pulse { animation: none; } }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.6" stop-color="#0a0f2c"/>
      <stop offset="1" stop-color="#140a2c"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="winL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f0b24"/>
      <stop offset="1" stop-color="#0c0a18"/>
    </linearGradient>
    <linearGradient id="winR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#062030"/>
      <stop offset="1" stop-color="#0a0f22"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155"/>
    </pattern>
    <filter id="glowM" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="540" fill="url(#bg)"/>
  <rect width="1200" height="540" fill="url(#dots)" opacity="0.5"/>

  <text class="mono" x="40" y="52" fill="#67e8f9" font-size="13" letter-spacing="4">// ILLUSTRATION   EVAL 1: ADD createdAt AS YYYY-MM-DD</text>

  <rect x="40" y="84" width="540" height="406" rx="14" fill="none" stroke="#f472b6" stroke-width="18" stroke-opacity="0.22" filter="url(#glowM)"/>
  <rect x="620" y="84" width="540" height="406" rx="14" fill="none" stroke="#22d3ee" stroke-width="18" stroke-opacity="0.28" filter="url(#glowM)"/>

  <rect x="40" y="84" width="540" height="406" rx="14" fill="url(#winL)" stroke="#f472b6" stroke-opacity="0.6" stroke-width="1.5"/>
  <path d="M40 120H580" stroke="#3b1d3a"/>
  <circle cx="64" cy="102" r="5.5" fill="#ff5f57"/>
  <circle cx="84" cy="102" r="5.5" fill="#febc2e"/>
  <circle cx="104" cy="102" r="5.5" fill="#28c840"/>
  <text class="mono" x="126" y="106" fill="#f9a8d4" font-size="12">src/export/dateHelper.js   [new file]</text>

  <g class="mono" font-size="20" font-weight="800" letter-spacing="3">
    <text class="g1" x="66" y="154" fill="#22d3ee" opacity="0.7">TYPICAL BLOAT</text>
    <text class="g2" x="62" y="154" fill="#f472b6" opacity="0.85">TYPICAL BLOAT</text>
    <text x="64" y="154" fill="#fdf2f8">TYPICAL BLOAT</text>
  </g>

  <g class="mono" font-size="13" fill="#ddd3e6">
    <text x="64" y="182"><tspan class="k">function</tspan> fmtDate(d, fmt = <tspan class="s">'YYYY-MM-DD'</tspan>) {</text>
    <text x="64" y="203">  <tspan class="k">try</tspan> {</text>
    <text x="64" y="224">    <tspan class="k">if</tspan> (!d) <tspan class="k">return</tspan> <tspan class="s">''</tspan>;</text>
    <text x="64" y="245">    <tspan class="k">const</tspan> date = <tspan class="k">new</tspan> Date(d);</text>
    <text x="64" y="266">    <tspan class="k">if</tspan> (isNaN(date)) <tspan class="k">return</tspan> <tspan class="s">''</tspan>;</text>
    <text x="64" y="287">    <tspan class="k">const</tspan> y = date.getFullYear();</text>
    <text x="64" y="308">    <tspan class="k">const</tspan> m = String(date.getMonth() + 1)</text>
    <text x="64" y="329">      .padStart(2, <tspan class="s">'0'</tspan>);</text>
    <text x="64" y="350">    <tspan class="c">// ... day, fmt.replace(...)</tspan></text>
    <text x="64" y="371">  } <tspan class="k">catch</tspan> (e) {</text>
    <text x="64" y="392">    <tspan class="k">return</tspan> <tspan class="s">''</tspan>;</text>
    <text x="64" y="413">  }</text>
    <text x="64" y="434">}</text>
  </g>

  <g stroke="#f472b6" stroke-opacity="0.45" stroke-dasharray="2 4">
    <path d="M392 177H404"/>
    <path d="M244 219H404"/>
    <path d="M329 282H404"/>
    <path d="M181 387H404"/>
  </g>
  <g class="mono" font-size="12">
    <rect x="404" y="167" width="118" height="20" rx="10" fill="#f472b6" fill-opacity="0.14" stroke="#f472b6" stroke-opacity="0.7"/>
    <text x="416" y="181" fill="#fbcfe8">unused option</text>
    <rect x="404" y="209" width="125" height="20" rx="10" fill="#f472b6" fill-opacity="0.14" stroke="#f472b6" stroke-opacity="0.7"/>
    <text x="416" y="223" fill="#fbcfe8">silent default</text>
    <rect x="404" y="272" width="161" height="20" rx="10" fill="#f472b6" fill-opacity="0.14" stroke="#f472b6" stroke-opacity="0.7"/>
    <text x="416" y="286" fill="#fbcfe8">local time, not UTC</text>
    <rect x="404" y="377" width="132" height="20" rx="10" fill="#f472b6" fill-opacity="0.14" stroke="#f472b6" stroke-opacity="0.7"/>
    <text x="416" y="391" fill="#fbcfe8">swallowed error</text>
    <rect x="64" y="452" width="306" height="24" rx="12" fill="#f472b6" fill-opacity="0.2" stroke="#f472b6"/>
    <text x="77" y="468" fill="#fdf2f8">duplicates src/utils/date.js:formatDate</text>
  </g>

  <rect x="620" y="84" width="540" height="406" rx="14" fill="url(#winR)" stroke="#22d3ee" stroke-opacity="0.7" stroke-width="1.5"/>
  <path d="M620 120H1160" stroke="#123344"/>
  <circle cx="644" cy="102" r="5.5" fill="#ff5f57"/>
  <circle cx="664" cy="102" r="5.5" fill="#febc2e"/>
  <circle cx="684" cy="102" r="5.5" fill="#28c840"/>
  <text class="mono" x="706" y="106" fill="#a5f3fc" font-size="12">src/export/order.js   [2-line diff]</text>

  <text class="mono" x="644" y="154" fill="url(#title)" font-size="20" font-weight="800" letter-spacing="3" filter="url(#glow)">WITH DE-BLOAT</text>

  <rect x="621" y="167" width="538" height="21" fill="#22d3ee" fill-opacity="0.12"/>
  <rect x="621" y="293" width="538" height="21" fill="#22d3ee" fill-opacity="0.12"/>
  <rect x="621" y="167" width="3" height="21" fill="#22d3ee"/>
  <rect x="621" y="293" width="3" height="21" fill="#22d3ee"/>

  <g class="mono" font-size="13" fill="#e2e8f0">
    <text x="640" y="182" fill="#22d3ee">+</text>
    <text x="640" y="308" fill="#22d3ee">+</text>
    <text x="662" y="182"><tspan class="k">const</tspan> { formatDate } = require(<tspan class="s2">'../utils/date'</tspan>);</text>
    <text x="662" y="224"><tspan class="k">function</tspan> toRows(orders) {</text>
    <text x="662" y="245">  <tspan class="k">return</tspan> orders.map((o) =&gt; ({</text>
    <text x="662" y="266">    id: o.id,</text>
    <text x="662" y="287">    amount: o.amount,</text>
    <text x="662" y="308">    createdAt: formatDate(o.createdAt),</text>
    <text x="662" y="329">  }));</text>
    <text x="662" y="350">}</text>
  </g>
  <rect class="blink" x="675" y="339" width="8" height="14" fill="#a5f3fc"/>

  <path d="M644 372H1136" stroke="#164e63" stroke-dasharray="3 5"/>
  <g class="mono" font-size="12.5">
    <circle cx="652" cy="394" r="9" fill="#22d3ee"/>
    <text x="652" y="398" fill="#0b1020" font-size="11" font-weight="800" text-anchor="middle">0</text>
    <text x="672" y="398" fill="#a5f3fc">map     <tspan fill="#cbd5e1">src/utils/ holds shared helpers</tspan></text>
    <circle cx="652" cy="416" r="9" fill="#38bdf8"/>
    <text x="652" y="420" fill="#0b1020" font-size="11" font-weight="800" text-anchor="middle">1</text>
    <text x="672" y="420" fill="#a5f3fc">reuse   <tspan fill="#cbd5e1">utils/date.js:formatDate</tspan></text>
    <circle cx="652" cy="438" r="9" fill="#818cf8"/>
    <text x="652" y="442" fill="#0b1020" font-size="11" font-weight="800" text-anchor="middle">2</text>
    <text x="672" y="442" fill="#a5f3fc">diff    <tspan fill="#cbd5e1">2 lines in order.js</tspan></text>
    <circle cx="652" cy="460" r="9" fill="#f472b6"/>
    <text x="652" y="464" fill="#0b1020" font-size="11" font-weight="800" text-anchor="middle">4</text>
    <text x="672" y="464" fill="#a5f3fc">verify  <tspan fill="#cbd5e1">ran node, output shown in reply</tspan></text>
  </g>

  <circle class="pulse" cx="600" cy="287" r="20" fill="#0b1020" stroke="url(#neon)" stroke-width="2" filter="url(#glow)"/>
  <text class="mono" x="600" y="292" fill="#e0e7ff" font-size="14" font-weight="800" text-anchor="middle">-&gt;</text>

  <text class="mono" x="600" y="522" fill="#64748b" font-size="12" text-anchor="middle">Illustration of the target behavior for eval 1. Not a recorded model output.</text>
  <rect x="0" y="536" width="1200" height="4" fill="url(#neon)"/>
</svg>
