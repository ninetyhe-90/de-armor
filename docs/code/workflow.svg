<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img" aria-label="de-armor coding route workflow: map, reuse, lean build, security floor, verify">
  <defs>
    <style>
      text { white-space: pre; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .flow { stroke-dasharray: 6 8; animation: dash 1.2s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
      @media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.6" stop-color="#0a0f2c"/>
      <stop offset="1" stop-color="#140a2c"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0.15" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowM" cx="0.92" cy="0.85" r="0.5">
      <stop offset="0" stop-color="#e879f9" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e879f9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155"/>
    </pattern>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="450" fill="url(#bg)"/>
  <rect width="1200" height="450" fill="url(#dots)" opacity="0.5"/>
  <rect width="1200" height="450" fill="url(#glowC)"/>
  <rect width="1200" height="450" fill="url(#glowM)"/>

  <g class="mono">
    <text x="40" y="50" fill="#67e8f9" font-size="13" letter-spacing="4">// WORKFLOW</text>
    <text x="40" y="76" fill="#94a3b8" font-size="14">No step starts without a conclusion from the last.</text>
  </g>

  <g fill="none" stroke-width="22" stroke-opacity="0.35" filter="url(#blur)">
    <rect x="40" y="100" width="200" height="160" rx="14" stroke="#22d3ee"/>
    <rect x="272" y="100" width="200" height="160" rx="14" stroke="#38bdf8"/>
    <rect x="504" y="100" width="200" height="160" rx="14" stroke="#818cf8"/>
    <rect x="736" y="100" width="200" height="160" rx="14" stroke="#c084fc"/>
    <rect x="968" y="100" width="200" height="160" rx="14" stroke="#f472b6"/>
  </g>

  <g stroke-width="2" fill="none" stroke-linecap="round">
    <path class="flow" d="M240 180H268" stroke="#38bdf8"/>
    <path class="flow" d="M472 180H500" stroke="#818cf8"/>
    <path class="flow" d="M704 180H732" stroke="#c084fc"/>
    <path class="flow" d="M936 180H964" stroke="#f472b6"/>
  </g>

  <g class="mono">
    <rect x="40" y="100" width="200" height="160" rx="14" fill="url(#glass)" stroke="#22d3ee" stroke-width="1.5"/>
    <circle cx="70" cy="130" r="16" fill="#22d3ee"/>
    <text x="70" y="135" fill="#0b1020" font-size="15" font-weight="800" text-anchor="middle">0</text>
    <text x="58" y="178" fill="#f8fafc" font-size="19" font-weight="700">Map &amp; goal</text>
    <text x="58" y="206" fill="#94a3b8" font-size="12.5">5-line structure map</text>
    <text x="58" y="226" fill="#94a3b8" font-size="12.5">a path for every line</text>
    <text x="58" y="246" fill="#94a3b8" font-size="12.5">testable goals</text>

    <rect x="272" y="100" width="200" height="160" rx="14" fill="url(#glass)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="302" cy="130" r="16" fill="#38bdf8"/>
    <text x="302" y="135" fill="#0b1020" font-size="15" font-weight="800" text-anchor="middle">1</text>
    <text x="290" y="178" fill="#f8fafc" font-size="19" font-weight="700">Reuse first</text>
    <text x="290" y="206" fill="#94a3b8" font-size="12.5">search the whole repo</text>
    <text x="290" y="226" fill="#94a3b8" font-size="12.5">reuse / adapt / new</text>
    <text x="290" y="246" fill="#94a3b8" font-size="12.5">new must say why</text>

    <rect x="504" y="100" width="200" height="160" rx="14" fill="url(#glass)" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="534" cy="130" r="16" fill="#818cf8"/>
    <text x="534" y="135" fill="#0b1020" font-size="15" font-weight="800" text-anchor="middle">2</text>
    <text x="522" y="178" fill="#f8fafc" font-size="19" font-weight="700">Lean build</text>
    <text x="522" y="206" fill="#94a3b8" font-size="12.5">YAGNI, fail loudly</text>
    <text x="522" y="226" fill="#94a3b8" font-size="12.5">batch over loops</text>
    <text x="522" y="246" fill="#94a3b8" font-size="12.5">surgical diff</text>

    <rect x="736" y="100" width="200" height="160" rx="14" fill="url(#glass)" stroke="#c084fc" stroke-width="1.5"/>
    <circle cx="766" cy="130" r="16" fill="#c084fc"/>
    <text x="766" y="135" fill="#0b1020" font-size="15" font-weight="800" text-anchor="middle">3</text>
    <text x="754" y="178" fill="#f8fafc" font-size="19" font-weight="700">Security floor</text>
    <text x="754" y="206" fill="#94a3b8" font-size="12.5">6 hard rules</text>
    <text x="754" y="226" fill="#94a3b8" font-size="12.5">validate at the edge</text>
    <text x="754" y="246" fill="#94a3b8" font-size="12.5">trust inside</text>

    <rect x="968" y="100" width="200" height="160" rx="14" fill="url(#glass)" stroke="#f472b6" stroke-width="1.5"/>
    <circle cx="998" cy="130" r="16" fill="#f472b6"/>
    <text x="998" y="135" fill="#0b1020" font-size="15" font-weight="800" text-anchor="middle">4</text>
    <text x="986" y="178" fill="#f8fafc" font-size="19" font-weight="700">Verify</text>
    <text x="986" y="206" fill="#94a3b8" font-size="12.5">run it this turn</text>
    <text x="986" y="226" fill="#94a3b8" font-size="12.5">read the output</text>
    <text x="986" y="246" fill="#94a3b8" font-size="12.5">no proof, no "done"</text>
  </g>

  <g fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.8">
    <path class="flow" d="M604 260V296M264 296H944M264 296V330M604 296V330M944 296V330"/>
  </g>
  <g class="pulse" fill="#a5b4fc" filter="url(#soft)">
    <circle cx="604" cy="296" r="4"/>
    <circle cx="264" cy="296" r="4"/>
    <circle cx="944" cy="296" r="4"/>
  </g>

  <g class="mono">
    <rect x="114" y="330" width="300" height="90" rx="12" fill="url(#glass)" stroke="#334155"/>
    <rect x="114" y="344" width="3" height="62" rx="1.5" fill="#22d3ee"/>
    <text x="134" y="362" fill="#67e8f9" font-size="13" font-weight="700" letter-spacing="2">2.1  LANGUAGE STYLE</text>
    <text x="134" y="386" fill="#94a3b8" font-size="12.5">official guide per file</text>
    <text x="134" y="406" fill="#94a3b8" font-size="12.5">project config wins</text>

    <rect x="454" y="330" width="300" height="90" rx="12" fill="url(#glass)" stroke="#334155"/>
    <rect x="454" y="344" width="3" height="62" rx="1.5" fill="#818cf8"/>
    <text x="474" y="362" fill="#a5b4fc" font-size="13" font-weight="700" letter-spacing="2">2.2  BUG FIX</text>
    <text x="474" y="386" fill="#94a3b8" font-size="12.5">root cause before fix</text>
    <text x="474" y="406" fill="#94a3b8" font-size="12.5">failing test first</text>

    <rect x="794" y="330" width="300" height="90" rx="12" fill="url(#glass)" stroke="#334155"/>
    <rect x="794" y="344" width="3" height="62" rx="1.5" fill="#e879f9"/>
    <text x="814" y="362" fill="#f0abfc" font-size="13" font-weight="700" letter-spacing="2">2.3  ABSTRACTION</text>
    <text x="814" y="386" fill="#94a3b8" font-size="12.5">based on real callers</text>
    <text x="814" y="406" fill="#94a3b8" font-size="12.5">never on "maybe later"</text>
  </g>

  <rect x="0" y="446" width="1200" height="4" fill="url(#neon)"/>
</svg>
